[project]
name = "shareholder_registry"
version = "0.1.0"
description = "Aksjonærregisteret Database"
readme = "README.md"
license         = { text = "MIT" }
authors = [{name = "Mauricio Moreira Soares"}]
requires-python = ">=3.13,<4.0"

dependencies = [
    "dotenv>=0.9.9",
    "eralchemy2>=1.4.1",
    "fastapi>=0.141.1",
    "psycopg>=3.3.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.52.4",
]

[project.urls]
Repository = "https://github.com/phydev/shareholder_registry_db"

[dependency-groups]
dev = [
    "hatchling>=1.24",     # build backend – required by `uv build`
    "ruff>=0.4",
    "ruff-lsp>=0.0.62",
    "pyright>=1.1.410",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "testcontainers",
    "coverage[toml]>=7.0",
    "black",
    "ipython>=9.17.1"
]


[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py311"
exclude = []

[tool.ruff.lint]
# Rule sets enabled:
#   E / W  – pycodestyle errors and warnings
#   F      – Pyflakes (undefined names, unused imports, …)
#   I      – isort (import ordering)
#   UP     – pyupgrade (modern Python syntax)
#   B      – flake8-bugbear (common gotchas)
#   SIM    – flake8-simplify
#   NPY    – NumPy-specific rules
select = ["E", "W", "F", "I", "UP", "B", "SIM", "NPY"]

# Ignore rules that conflict with the scientific-computing style used here:
#   E501   – line too long (handled by the formatter, not the linter)
#   B008   – function calls in default args (common in NumPy wrappers)
#   UP007  – Optional[X] → X | None  (keep explicit Optional for readability)
ignore = ["E501", "B008", "UP007"]


[tool.ruff.lint.per-file-ignores]

# Tests can use assert-style checks and shorter variable names.
"tests/*"            = ["S101", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["shareholder_registry"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths     = ["tests"]
python_files  = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src/"]
# Show short test summary and local variables on failure.
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["src/shareholder_registry/tests/*"]

[tool.coverage.report]
show_missing   = true
skip_covered   = false
fail_under     = 60      # raise CI failure if coverage drops below 30 %
exclude_lines  = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
